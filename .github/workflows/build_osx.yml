name: macOS

on:
  push:
      branches:
        - "*"
      tags:
        - "*"

  pull_request:
      branches:
        - "*"

jobs:
  build-shared:
    name: "Libs: ${{ matrix.libs }}, FS Lib: ${{ matrix.fslib }}, Arch: ${{ matrix.arch }}, Build OS: ${{ matrix.runs-on }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        libs: ['shared', 'static']
        fslib: ['stl', 'boost']
        arch: ['arm64', 'x86_64']
        runs-on: ['macos-15', 'macos-15-intel']
        exclude:
          - arch: arm64
            runs-on: macos-15-intel
          - arch: x86_64
            runs-on: macos-15
          ### BROKEN: Homebrew's Boost build for arm64 does not properly populate the include dir of the Boost CMake targets.
          - arch: arm64
            runs-on: macos-15
            fslib: boost

    steps:
      - name: Install Packages
        run: brew install sdl2 ninja googletest

      - name: Install boost-filesystem-dev
        if: "${{ contains(matrix.fslib, 'boost') }}"
        run: |
          brew install boost

      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Configure Build
        run: |
          if [ "${{ matrix.libs }}" == "shared" ]; then
          shared_libs=ON
          else
          shared_libs=OFF
          fi
          if [ "${{ matrix.fslib }}" == "boost" ]; then
          use_boost=ON
          else
          use_boost=OFF
          fi
          cmake -G "Ninja Multi-Config" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_VERBOSE_MAKEFILE=YES \
            -DBUILD_SHARED_LIBS="${shared_libs}" \
            -DENABLE_BOOST_FILESYSTEM="${use_boost}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DENABLE_CXX_INTERFACE=YES \
            -DBUILD_TESTING=YES

      - name: Build Debug
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --parallel

      - name: Run Unit Tests
        run: ctest --test-dir "${{ github.workspace }}/cmake-build" --verbose --build-config "Debug"

      - name: Build Release
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --parallel

      - name: Install
        run: |
          cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --target install
          cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --target install

      - name: Test C++ Interface
        run: |
          cmake -G "Ninja Multi-Config" \
            -S "${{ github.workspace }}/tests/cxx-interface" \
            -B "${{ github.workspace }}/cmake-build-cxx-api" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

          cmake --build "${{ github.workspace }}/cmake-build-cxx-api" --config "Debug"
          cmake --build "${{ github.workspace }}/cmake-build-cxx-api" --config "Release"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
            name: projectm-osx-${{ matrix.libs }}-${{ matrix.fslib }}-${{ matrix.arch }}-${{ matrix.runs-on }}
            path: install/*

  build-framework:
    name: "Framework: ${{ matrix.cxx_interface && 'C + C++' || 'C only' }}, Arch: ${{ matrix.arch }}, Build OS: ${{ matrix.runs-on }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        arch: ['arm64', 'x86_64']
        cxx_interface: [true, false]
        runs-on: ['macos-15', 'macos-15-intel']
        exclude:
          - arch: arm64
            runs-on: macos-15-intel
          - arch: x86_64
            runs-on: macos-15

    steps:
      - name: Install Packages
        run: brew install ninja

      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Configure Framework Build
        run: |
          if [ "${{ matrix.cxx_interface }}" == "true" ]; then
          cxx_iface=ON
          else
          cxx_iface=OFF
          fi
          cmake -G "Ninja Multi-Config" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_VERBOSE_MAKEFILE=YES \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_MACOS_FRAMEWORK=ON \
            -DENABLE_CXX_INTERFACE="${cxx_iface}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"

      - name: Build Release
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --parallel

      - name: Validate Frameworks
        run: |
          STRICT=1 bash "${{ github.workspace }}/scripts/test-macos-framework.sh" \
            "${{ github.workspace }}/cmake-build"

      - name: Install
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --target install

      - name: Verify Installed Frameworks
        run: |
          echo "--- Checking installed framework structure ---"
          ls -la "${{ github.workspace }}/install/lib/"
          # Verify frameworks were installed (not bare dylibs)
          test -d "${{ github.workspace }}/install/lib/projectM-4.framework" \
            || { echo "FAIL: projectM-4.framework not installed"; exit 1; }
          test -d "${{ github.workspace }}/install/lib/projectM-4-playlist.framework" \
            || { echo "FAIL: projectM-4-playlist.framework not installed"; exit 1; }
          # Run the same validation on installed frameworks
          STRICT=1 bash "${{ github.workspace }}/scripts/test-macos-framework.sh" \
            "${{ github.workspace }}/install"

      - name: Upload Framework Artifact
        uses: actions/upload-artifact@v7
        with:
            name: projectm-osx-framework-${{ matrix.cxx_interface && 'cxx' || 'c-only' }}-${{ matrix.arch }}-${{ matrix.runs-on }}
            path: install/*

  build-framework-embedded:
    name: "Framework: ${{ matrix.platform }} (${{ matrix.sdk }})"
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            target: arm64-apple-ios15.0
            plist_platform: iPhoneOS
          - platform: iOS
            sdk: iphonesimulator
            target: arm64-apple-ios15.0-simulator
            plist_platform: iPhoneSimulator
          - platform: tvOS
            sdk: appletvos
            target: arm64-apple-tvos15.0
            plist_platform: AppleTVOS

    steps:
      - name: Install Packages
        run: brew install ninja

      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Configure Framework Build
        run: |
          cmake -G "Ninja" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_SYSTEM_NAME="${{ matrix.platform }}" \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sdk }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_GLES=ON \
            -DENABLE_MACOS_FRAMEWORK=ON

      - name: Build
        run: cmake --build "${{ github.workspace }}/cmake-build" --parallel

      - name: Install
        run: cmake --build "${{ github.workspace }}/cmake-build" --target install

      - name: Validate Frameworks
        run: |
          set -e
          lib="${{ github.workspace }}/install/lib"
          for fw in projectM-4 projectM-4-playlist; do
            dir="$lib/$fw.framework"
            echo "--- $fw.framework ---"
            ls -la "$dir" "$dir/Headers"
            # Shallow bundle: binary, Info.plist and Headers at the root, no Versions directory.
            test -f "$dir/$fw" || { echo "FAIL: missing binary"; exit 1; }
            test -f "$dir/Info.plist" || { echo "FAIL: missing Info.plist"; exit 1; }
            test -d "$dir/Headers" || { echo "FAIL: missing Headers"; exit 1; }
            test ! -e "$dir/Versions" || { echo "FAIL: unexpected Versions directory"; exit 1; }
            plutil -lint "$dir/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$dir/Info.plist")" = "$fw"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$dir/Info.plist")" = "${{ matrix.plist_platform }}"
            test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$dir/Info.plist")" = "15.0"
            install_name=$(otool -D "$dir/$fw" | tail -1)
            echo "Install name: $install_name"
            test "$install_name" = "@rpath/$fw.framework/$fw"
            vtool -show-build "$dir/$fw"
          done
          otool -L "$lib/projectM-4-playlist.framework/projectM-4-playlist" | grep -q "@rpath/projectM-4.framework/projectM-4" \
            || { echo "FAIL: playlist does not reference projectM-4.framework"; exit 1; }

      - name: Compile and Link Against Frameworks
        run: |
          set -e
          cat > test.c <<'SRC'
          #include <projectM-4/projectM.h>
          #include <projectM-4/playlist.h>

          int main(void)
          {
              projectm_handle pm = projectm_create();
              projectm_playlist_handle playlist = projectm_playlist_create(pm);
              projectm_playlist_destroy(playlist);
              projectm_destroy(pm);
              return 0;
          }
          SRC
          xcrun --sdk "${{ matrix.sdk }}" clang -target "${{ matrix.target }}" -Wall -Werror \
            -F "${{ github.workspace }}/install/lib" \
            -framework projectM-4 -framework projectM-4-playlist \
            -Wl,-rpath,@executable_path/Frameworks \
            test.c -o test-app
          otool -L test-app
